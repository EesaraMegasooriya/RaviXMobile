services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 5001
      TRUST_PROXY: "1"
      ALLOWED_ORIGINS: ${SITE_ORIGIN:-http://localhost}
    expose:
      - "5001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5001/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
        VITE_WHATSAPP_NUMBER: ${VITE_WHATSAPP_NUMBER:-94703280480}
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
volumes:
  caddy_data:
  caddy_config:
